<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbital Common</title><style>*{box-sizing:border-box}body{margin:0;background:#b7c9ff;color:#242536;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;overflow:hidden}.copy{position:fixed;left:5vw;top:5vh}.copy span{font:700 9px monospace;letter-spacing:.2em}.copy h1{font-size:clamp(42px,7vw,80px);letter-spacing:-.08em;line-height:.82;margin:12px 0}.system{width:min(68vw,620px);aspect-ratio:1;border:1px solid #24253644;border-radius:50%;position:relative;animation:spin 22s linear infinite}.sun{position:absolute;inset:42%;border-radius:50%;background:#ff7058;box-shadow:0 0 0 20px #b7c9ff,0 0 0 21px #242536}.planet{position:absolute;border:0;border-radius:50%;background:#d6ff45;cursor:pointer;box-shadow:0 0 0 8px #b7c9ff,0 0 0 9px #242536}.p1{width:46px;height:46px;left:8%;top:35%}.p2{width:30px;height:30px;right:16%;bottom:20%;background:#72f3bd}.p3{width:24px;height:24px;right:8%;top:20%;background:#f2f0e9}.status{position:fixed;right:5vw;bottom:5vh;font:700 11px monospace}@keyframes spin{to{rotate:360deg}}</style></head><body><div class="copy"><span>ALIGN THREE WORLDS</span><h1>ORBITAL<br>COMMON</h1><p>依照大小順序點擊行星。</p></div><div class="system"><div class="sun"></div><button class="planet p1" data-v="3"></button><button class="planet p2" data-v="2"></button><button class="planet p3" data-v="1"></button></div><div class="status" id="status">SEQUENCE 0 / 3</div><script>let expected=1,n=0,s=document.querySelector('#status');document.querySelectorAll('.planet').forEach(p=>p.onclick=()=>{if(+p.dataset.v===expected){n++;expected++;p.style.opacity=.28;s.textContent=n===3?'SYSTEM IN HARMONY ✦':`SEQUENCE ${n} / 3`}else{s.textContent='ORBIT BROKEN — TRY AGAIN';expected=1;n=0;document.querySelectorAll('.planet').forEach(x=>x.style.opacity=1)}})</script></body></html>
