<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Void Runner</title>
  <style>
    *{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0d100d;color:#f2f0e9;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:22px 24px auto;display:flex;justify-content:space-between;font:700 11px monospace;letter-spacing:.16em;pointer-events:none}.intro{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:rgba(13,16,13,.76);backdrop-filter:blur(6px)}.intro div{max-width:430px;padding:28px}.intro h1{font-size:clamp(44px,10vw,88px);letter-spacing:-.08em;line-height:.8;margin:0 0 24px}.intro p{opacity:.65;line-height:1.7}.intro button{border:0;background:#d6ff45;padding:15px 24px;font-weight:800;border-radius:4px;cursor:pointer}.hide{display:none}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud"><span>VOID RUNNER / OPEN GAMES</span><span id="score">0000 M</span></div>
  <div class="intro" id="intro"><div><h1>VOID<br>RUNNER</h1><p>使用 ← → 或拖曳移動。穿過光門，避開暗色碎片。</p><button id="start">開始奔跑 ↗</button></div></div>
  <script>
    const c=document.querySelector('#game'),x=c.getContext('2d'),intro=document.querySelector('#intro'),scoreEl=document.querySelector('#score');
    let W,H,d=1,ship,obs,score,running,last;
    function resize(){d=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
    addEventListener('resize',resize);resize();
    function reset(){ship={x:W/2,y:H*.78,v:0};obs=[];score=0;last=performance.now()}
    function spawn(){obs.push({x:30+Math.random()*(W-60),y:-40,s:18+Math.random()*35,v:2.6+Math.min(score/900,5),gate:Math.random()>.72})}
    function draw(t){
      x.fillStyle='#0d100d';x.fillRect(0,0,W,H);x.strokeStyle='rgba(214,255,69,.13)';x.lineWidth=1;
      for(let i=0;i<18;i++){let yy=i*55+(t*.05)%55;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy);x.stroke()}
      for(let i=0;i<14;i++){x.beginPath();x.moveTo(W/2+(i-7)*20,0);x.lineTo(W/2+(i-7)*80,H);x.stroke()}
      obs.forEach(o=>{x.fillStyle=o.gate?'#72f3bd':'#ff7058';if(o.gate){x.strokeStyle='#72f3bd';x.lineWidth=8;x.beginPath();x.arc(o.x,o.y,o.s,0,Math.PI*2);x.stroke()}else{x.save();x.translate(o.x,o.y);x.rotate(t*.001);x.fillRect(-o.s/2,-o.s/2,o.s,o.s);x.restore()}});
      x.save();x.translate(ship.x,ship.y);x.fillStyle='#f2f0e9';x.beginPath();x.moveTo(0,-24);x.lineTo(-16,18);x.lineTo(0,10);x.lineTo(16,18);x.closePath();x.fill();x.fillStyle='#d6ff45';x.fillRect(-3,12,6,22);x.restore();
    }
    function loop(t){
      if(!running)return;let dt=Math.min((t-last)/16.67,2);last=t;if(Math.random()<.025)spawn();ship.x=Math.max(20,Math.min(W-20,ship.x+ship.v*dt));obs.forEach(o=>o.y+=o.v*dt);
      obs=obs.filter(o=>{let hit=Math.hypot(o.x-ship.x,o.y-ship.y)<o.s+13;if(hit&&!o.gate){running=false;intro.classList.remove('hide');intro.querySelector('h1').innerHTML='RUN<br>ENDED';intro.querySelector('p').textContent=`你航行了 ${Math.floor(score)} 公尺。再試一次？`;intro.querySelector('button').textContent='重新開始 ↗'}if(hit&&o.gate){score+=120;return false}return o.y<H+80&&!hit});
      score+=dt*.7;scoreEl.textContent=String(Math.floor(score)).padStart(4,'0')+' M';draw(t);requestAnimationFrame(loop);
    }
    document.querySelector('#start').onclick=()=>{reset();running=true;intro.classList.add('hide');requestAnimationFrame(loop)};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')ship.v=-8;if(e.key==='ArrowRight')ship.v=8});
    addEventListener('keyup',e=>{if(e.key.startsWith('Arrow'))ship.v=0});
    let sx;addEventListener('pointerdown',e=>sx=e.clientX);addEventListener('pointermove',e=>{if(sx!==undefined&&ship){ship.x+=e.clientX-sx;sx=e.clientX}});addEventListener('pointerup',()=>sx=undefined);
    reset();draw(0);
  </script>
</body>
</html>
