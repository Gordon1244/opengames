<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Tideline</title><style>body{margin:0;overflow:hidden;background:#ff7058;color:#141713;font-family:system-ui,sans-serif}.sea{position:fixed;inset:0;background:radial-gradient(circle at 70% 20%,#d6ff45 0 8%,transparent 8.2%),repeating-radial-gradient(ellipse at 50% 110%,transparent 0 55px,#11130f 56px 66px,transparent 67px 105px);animation:tide 6s ease-in-out infinite alternate}.orb{position:absolute;width:64px;height:64px;border-radius:50%;background:#f2f0e9;box-shadow:0 14px 0 #11130f;cursor:pointer;transition:.2s}.orb:active{scale:.82}.copy{position:fixed;left:7vw;top:8vh}.copy span{font:700 10px monospace;letter-spacing:.2em}.copy h1{font-size:clamp(54px,9vw,110px);letter-spacing:-.09em;line-height:.78;margin:18px 0}.score{position:fixed;right:6vw;bottom:6vh;font:700 16px monospace}@keyframes tide{to{transform:translateY(-40px) scale(1.05)}}</style></head><body><div class="sea" id="sea"><div class="copy"><span>CLICK THE SIGNAL / FOLLOW THE TIDE</span><h1>NEON<br>TIDELINE</h1><p>在訊號消失以前點亮它。</p></div><button class="orb" id="orb" aria-label="收集訊號"></button><div class="score" id="score">SIGNALS 00</div></div><script>let n=0,o=document.querySelector('#orb'),s=document.querySelector('#score');function move(){o.style.left=10+Math.random()*80+'vw';o.style.top=22+Math.random()*62+'vh';o.style.background=['#f2f0e9','#d6ff45','#72f3bd'][n%3]}o.onclick=()=>{n++;s.textContent='SIGNALS '+String(n).padStart(2,'0');move()};move()</script></body></html>
