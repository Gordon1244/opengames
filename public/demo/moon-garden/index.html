<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moon Garden</title><style>body{margin:0;background:#20372f;color:#f2f0e9;font-family:system-ui,sans-serif;overflow:hidden}.moon{position:fixed;width:32vw;height:32vw;min-width:230px;min-height:230px;border-radius:50%;background:#ffd890;right:7vw;top:7vh;box-shadow:0 0 0 28px #ffd89011,0 0 0 64px #ffd89008}.copy{position:fixed;left:6vw;top:7vh}.copy span{font:700 9px monospace;letter-spacing:.2em;color:#72f3bd}.copy h1{font-size:clamp(48px,8vw,95px);letter-spacing:-.09em;line-height:.8;margin:16px 0}.ground{position:fixed;inset:55% 0 0;background:#172a23;border-top:1px solid #72f3bd55;cursor:crosshair}.flower{position:absolute;width:6px;height:60px;background:#72f3bd;transform-origin:bottom;animation:grow .7s ease-out}.flower:before{content:'';position:absolute;width:25px;height:25px;border-radius:50% 4px;background:#ff7058;left:-10px;top:-12px;rotate:45deg}.hint{position:fixed;left:6vw;bottom:5vh;font:700 10px monospace;color:#72f3bd}@keyframes grow{from{scale:1 0}}</style></head><body><div class="moon"></div><div class="copy"><span>PLANT AFTER DARK</span><h1>MOON<br>GARDEN</h1><p>在土地上點擊，種下月光花。</p></div><div class="ground" id="ground"></div><div class="hint" id="hint">FLOWERS 00 / THE GARDEN REMEMBERS THIS MOMENT</div><script>let n=0,g=document.querySelector('#ground'),h=document.querySelector('#hint');g.onclick=e=>{let f=document.createElement('i');f.className='flower';f.style.left=e.clientX+'px';f.style.top=e.clientY-innerHeight*.55-50+'px';f.style.height=35+Math.random()*75+'px';f.style.filter=`hue-rotate(${Math.random()*80-30}deg)`;g.appendChild(f);n++;h.textContent='FLOWERS '+String(n).padStart(2,'0')+' / THE GARDEN REMEMBERS THIS MOMENT'}</script></body></html>
